rtabmap:
  ros__parameters:
    frame_id: base_link
    odom_frame_id: odom
    map_frame_id: map
    publish_tf: true
    tf_delay: 0.05

    # Use bundled RGBDImage from rgbd_sync node
    # This prevents RTAB-Map from subscribing to raw image topics
    # (which would compete with visual odom nodes for SHM resources)
    subscribe_depth: false
    subscribe_rgb: false
    subscribe_rgbd: true
    subscribe_scan: true
    subscribe_odom: true
    approx_sync: true
    approx_sync_max_interval: 0.5
    sync_queue_size: 30
    topic_queue_size: 30

    # NOTE: database_path, delete_db_on_start and Mem/IncrementalMemory are
    # deliberately NOT set in this file. They are what distinguish mapping
    # from localization, and each launch file sets all three explicitly:
    #   rtabmap_mapping.launch.py      -> IncrementalMemory true,  writable db
    #   rtabmap_localization.launch.py -> IncrementalMemory false, read-only db
    # This file holds only the tuning both modes share. Setting a mode key
    # here would silently override one of them — which is exactly how this
    # file previously forced the "mapping" launch into localization mode,
    # against a hardcoded single-user absolute path.

    # === Detection / Loop Closure ===
    Rtabmap/DetectionRate: '2.0'
    Rtabmap/TimeThr: '0.0'
    Rtabmap/MemoryThr: '0'
    # Loop closure threshold - lower = more sensitive (triggers more often)
    Rtabmap/LoopThr: '0.09'

    # === Visual Features (USED FOR LOOP CLOSURE) ===
    # FeatureType 8 = ORB (fast on ARM64)
    Vis/MinInliers: '15'
    Vis/MaxFeatures: '800'
    Vis/FeatureType: '8'
    Vis/CorNNType: '1'
    Kp/MaxFeatures: '800'
    Kp/DetectorStrategy: '8'
    Kp/NNStrategy: '1'

    # === Registration Strategy ===
    # 0 = Visual only, 1 = ICP only, 2 = Visual + ICP
    # MUST be 2 to use images for loop closure + ICP for refinement
    # (was 1 = ICP only, which defeats the purpose of RTAB-Map)
    Reg/Strategy: '2'
    Reg/Force3DoF: 'true'

    # === Optimizer ===
    Optimizer/Strategy: '1'
    Optimizer/Iterations: '20'
    Optimizer/Slam2D: 'true'
    RGBD/OptimizeMaxError: '3.0'

    # === Node Creation Thresholds ===
    # How far the robot must move before adding a new map node.
    # CRITICAL for ghost prevention during rotation:
    #   - Too low = spam nodes during rotation with drifted odom = ghosts
    #   - 0.35 rad (~20 deg) means no new node until significant rotation
    RGBD/AngularUpdate: '0.35'
    RGBD/LinearUpdate: '0.2'

    # === Proximity / Graph ===
    RGBD/ProximityBySpace: 'true'
    RGBD/ProximityMaxGraphDepth: '0'
    RGBD/ProximityPathMaxNeighbors: '10'
    RGBD/CreateOccupancyGrid: 'true'

    # === Occupancy Grid ===
    # Grid/Sensor picks the source: 0=laser scan, 1=depth image(s), 2=both.
    # 0 here, and 0 is also what rtabmap_ros would force on its own: with
    # subscribe_scan true and Grid/Sensor unset it sets 0 and warns, telling you
    # to state it explicitly to silence the warning (CoreWrapper.cpp). So this
    # is the default made visible, not a departure from it.
    #
    # Grid/FromDepth was removed here. It is the pre-0.20.15 name for this same
    # setting, and when both are present the NEW name wins and the old one is
    # discarded with "the new parameter is already used with value 0, ignoring
    # the old one with value true". It had no effect, and read as though the
    # grid came from depth images when it comes from the scan.
    Grid/Sensor: '0'
    Grid/RangeMax: '8.0'
    Grid/RangeMin: '0.3'
    Grid/CellSize: '0.05'

    # The scan RTAB-Map receives (/scan/depth) is 2D, and for a 2D scan with
    # Grid/Sensor=0 LocalGridMaker takes a separate path that uses only
    # RangeMin, RangeMax, CellSize and Grid/Scan2dUnknownSpaceFilled: every
    # surviving point becomes an obstacle cell, with no ground/obstacle
    # segmentation at all. So the four below do NOTHING today. They are kept,
    # not deleted, because they are the right values for Grid/Sensor:=1 or 2 --
    # but do not tune them expecting the current map to change.
    #
    # Grid/3D says so itself: "Ignored if laser scan is 2D and Grid/Sensor is 0".
    #
    # Grid/RayTracing is the one to know about: free space between the sensor
    # and an obstacle is filled by Grid/Scan2dUnknownSpaceFilled on the 2D path,
    # NOT by Grid/RayTracing, and that parameter defaults to false and is not
    # set here. So nothing currently marks free space -- everything the scan
    # does not hit stays unknown. Setting it changes the map, so it is a
    # deliberate decision rather than a cleanup.
    Grid/MaxObstacleHeight: '2.0'    # ignored while Grid/Sensor is 0
    Grid/MinObstacleHeight: '0.1'    # ignored while Grid/Sensor is 0
    Grid/MaxGroundHeight: '0.05'     # ignored while Grid/Sensor is 0
    Grid/3D: 'false'                 # ignored while Grid/Sensor is 0 and scan is 2D
    Grid/RayTracing: 'true'          # ignored on the 2D path; see above

    # The 2D path's ray tracing. Without it nothing marks free space: only the
    # cells the scan actually hits become obstacles and everything else stays
    # UNKNOWN. Nav2's global costmap runs track_unknown_space: true, so unknown
    # reads as blocked to the planner -- a map with no free space is a map the
    # planner cannot cross. Bounded by Grid/RangeMax above.
    #
    # Only affects MAPPING runs. In localization mode the grid cells come from
    # the nodes already stored in the .db, so changing this does not alter a
    # localization run against an existing map -- it takes effect the next time
    # rtabmap_mapping.launch.py builds one.
    Grid/Scan2dUnknownSpaceFilled: 'true'

    cloud_output_voxelized: true
    cloud_voxel_size: 0.02

    # === ICP (used for local scan refinement alongside visual) ===
    Icp/MaxCorrespondenceDistance: '0.2'
    Icp/VoxelSize: '0.05'
    Icp/PointToPlane: 'true'
    Icp/Iterations: '30'

    # === Memory ===
    # Mem/IncrementalMemory is NOT set here -- see the note at the top of this
    # file. It was set to 'false' below, directly contradicting that note: both
    # launch files happen to pass their own value after this file so the right
    # one won, but a third launch, or a reordering of that parameters list,
    # would have silently forced mapping into localization mode again.
    Mem/InitWMWithAllNodes: 'true'
    Mem/STMSize: '30'
    Mem/RehearsalSimilarity: '0.6'
    Mem/NotLinkedNodesKept: 'false'
