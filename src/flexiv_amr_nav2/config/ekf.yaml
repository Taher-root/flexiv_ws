### Enable one source at a time by changing false->true in its config
### Order: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # ============================================================
    # SOURCE 1: Wheel encoder velocities (Seer chassis)
    # Best for: forward/backward speed, basic yaw rate
    # Weakness: slip during rotation, no lateral
    # ============================================================
    odom0: /odom_raw
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # ============================================================
    # SOURCE 2: Chassis IMU (rigidly mounted at base_link)
    # Best for: yaw angular velocity (gyro)
    # Weakness: accelerometer drift, no absolute heading
    # ============================================================
    # imu0: /imu/chassis          # DISABLED: all update flags false
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true

    # ============================================================
    # SOURCE 3: Bottom D456 camera IMU
    # Best for: angular velocity, tilt detection
    # Weakness: mounted offset from base_link, noisier than chassis IMU
    # ============================================================
    imu1: /camera/imu
    imu1_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu1_queue_size: 10
    imu1_differential: false
    imu1_relative: false
    imu1_remove_gravitational_acceleration: true

    # ============================================================
    # SOURCE 4: Top D456 camera IMU
    # Best for: angular velocity, redundant gyro
    # Weakness: mounted high (z=0.8), more vibration
    # ============================================================
    imu2: /camera_top/camera_top/imu
    imu2_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu2_queue_size: 10
    imu2_differential: false
    imu2_relative: false
    imu2_remove_gravitational_acceleration: true

    # ============================================================
    # SOURCE 5: Bottom D456 visual odometry (RTAB-Map rgbd_odom)
    # Best for: 6DoF motion in feature-rich environments
    # Weakness: fails during fast rotation (motion blur), drifts
    # USE DIFFERENTIAL MODE to prevent jumps
    #
    # ENABLED 2026-09-18: this is the camera that is actually connected, so
    # it is the one visual odometry source feeding the filter. It was
    # previously commented out with "quality=0, publishes null poses" — if
    # that returns, watch /camera/odom's pose covariance and twist before
    # blaming the filter, and re-disable here rather than elsewhere.
    # Differential mode limits the damage from a tracking dropout.
    # ============================================================
    odom1: /camera/odom
    odom1_config: [false, false, false,
                   false, false, false,
                   true, false, false,
                   false, false, true,
                   false, false, false]
    odom1_queue_size: 10
    odom1_differential: true
    odom1_relative: false

    # ============================================================
    # SOURCE 6: Top D456 visual odometry (RTAB-Map rgbd_odom)
    # Best for: 6DoF motion, sees further (higher mount)
    # Weakness: same as bottom - motion blur, drift
    # USE DIFFERENTIAL MODE to prevent jumps
    #
    # DISABLED 2026-09-18: the top camera is not mounted in its final
    # position and is not plugged in, so this topic never publishes. Fusing
    # a dead source is worse than fusing none. The launch plumbing stays in
    # place (sensors.launch.py use_top_camera:=true) — uncomment the odom2
    # line below once the camera is physically mounted and connected.
    # ============================================================
    # odom2: /camera_top/odom     # DISABLED: top camera not mounted/connected
    odom2_config: [false, false, false,
                   false, false, false,
                   true, false, false,
                   false, false, true,
                   false, false, false]
    odom2_queue_size: 10
    odom2_differential: true
    odom2_relative: false

