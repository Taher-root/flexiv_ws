waist_driver:
  ros__parameters:
    source_robot_sn: "Rizon4-063352"
    mock_hardware: false
    publish_rate_hz: 200.0          # decimation from the RDK's 1 kHz stream
    joint_names: ["AGV_Jiont1", "AGV_Jiont2"]
