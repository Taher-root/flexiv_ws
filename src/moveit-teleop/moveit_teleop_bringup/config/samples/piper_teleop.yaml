# REFERENCE COPY -- not read by anything.
# The live file is agx_arm_moveit/config/teleop.yaml (and teleop_scene.yaml).
# Copy it next to your own MoveIt config and edit; see docs/ for the reference.

# AgileX Piper -- teleoperation config.
#
#     ros2 launch moveit_teleop_bringup teleop.launch.py \
#         robot_config_package:=agx_arm_moveit
#
# This file is the SOURCE OF TRUTH for everything below: teleop.launch.py
# declares each of these arguments with a sentinel and fills it from here, so a
# value changed in this file changes what runs. An argument passed explicitly
# still wins, which is what makes command-line experiments possible:
#
#     explicit launch argument  >  this file  >  FALLBACKS in _teleop_config.py
#
# A key this resolver does not know is an ERROR, not a silent skip. If you add
# a setting and the launch refuses it, the setting does not exist -- check the
# parameter reference rather than assuming it took effect.
#
# Everything ABSENT from this file is read at runtime from artifacts MoveIt
# already owns, and must not be added here:
#
#   robot_description           -> kinematics, joint names, link tree
#   robot_description_semantic  -> planning group, EE link, gripper open/close
#   kinematics.yaml             -> IK solver
#   joint_limits.yaml           -> velocity/acceleration limits
#   the planning scene          -> collision environment
#
# Also deliberately absent: arm_type / effector_type / tcp_offset. Those are
# arguments to the ROBOT BRINGUP (start_single_agx_arm_moveit.launch.py) and
# must match there. The only place teleop needs them is to build the replay
# preview robot, which is what files.preview_xacro_args below is for.

moveit_teleop:
  # The one genuinely required key. The retargeter, the IK solver and the mode
  # manager all resolve frames, joints and the controller from the SRDF via
  # this group name; note that 'tcp_link' deliberately appears nowhere below.
  move_group: arm

  # Posture to reach before engaging teleop. An SRDF named state, so the joint
  # values live with the robot model where they belong.
  #
  # It is needed because 'home' (all zeros) cannot be driven from on this arm:
  # joint2's limit is [0, 3.14] and joint3's is [-2.97, 0], so all-zeros sits
  # exactly ON two joint limits and is also a fully-extended elbow singularity.
  ready_state: ready_pose

  # What the IK is REGULARISED toward -- separate from ready_state, which is
  # only where the arm starts. 'midrange' uses each joint's mid-range; on this
  # arm that is far worse (Jacobian condition number 34111 against 121.8 for
  # ready_pose, because joint2 and joint3 nearly cancel into a straight elbow).
  # The node computes this number at startup and warns above 500.
  nominal_state: ready_pose

  # --- companion files -------------------------------------------------
  # Named relative to THIS FILE, so this package can be copied or renamed
  # without editing a path. Absolute paths also work.
  files:
    scene: teleop_scene.yaml
    # Omitted: rviz. Falls back to moveit_teleop_bringup/config/teleop.rviz,
    # whose TF whitelist already names this arm's tcp_link.
    #
    # The replay preview robot -- the green ghost arm the RViz panel scrubs
    # recorded episodes onto. These must describe the SAME robot the bringup
    # built, including tcp_offset, or the ghost is subtly the wrong shape.
    preview_urdf: agx_arm.urdf.xacro
    preview_srdf: agx_arm.srdf.xacro
    preview_xacro_args: >-
      arm_type:=piper effector_type:=agx_gripper
      tcp_offset_xyz:="0.0 0.0 0.1425" tcp_offset_rpy:="0.0 0.0 0.0"

  device:
    # Scripted-device settings; ignored when device:=xr.
    pattern: circle
    period: 6.0
    radius: 0.1

  retargeting:
    # Rotation and translation are scaled INDEPENDENTLY on purpose. A
    # comfortable hand-translation range is much smaller than the arm's reach,
    # so translation wants amplifying; wrist rotation has roughly the same
    # range as the tool's and wants damping. At 1:1 a small unintended wrist
    # roll is a large tool roll, which is what makes rotation feel twitchy.
    rotation_scale: 0.8

    # What the controller's motion is measured RELATIVE TO.
    #
    #   device  the operator. Forward means "away from me", however I am
    #           facing. The delta is re-expressed in the horizontal heading the
    #           controller had at the moment the clutch engaged.
    #   base    the room. Forward means one fixed direction in the play space,
    #           so turning your body around reverses every control.
    #   tool    composes a body-frame delta onto the tool, which needs a
    #           controller-to-tool alignment constant to feel right.
    #
    # 'device' takes only the HEADING, so tilting the controller down -- a
    # completely ordinary way to hold one -- does not tip the mapping.
    translation_ref: device
    rotation_ref: device

    # EMA weight of each new device sample; 1.0 disables it. 0.3 measured on
    # hardware: takes hand tremor out without adding much phase (about 32 ms at
    # the Quest's ~72 Hz). The IK node runs its own joint-space moving average
    # as well, so do not stack much more here.
    smoothing_alpha: 0.3

    # Applied to the SCALED target delta, so it is a limit on ROBOT motion per
    # update, not hand motion: raising translation_scale lowers the hand speed
    # at which it trips. At 90 Hz, 0.05 m/update is 4.5 m/s of tool motion.
    max_translation_step: 0.05

    max_target_lead_angle: 0.5

    # How far a WALL may move the command beyond what the hand drove, in one
    # update, before the mapping is re-zeroed instead. Ordinary motion
    # contributes no excess however fast it is, so this can be small.
    max_command_step: 0.03

    # Full IK returns the closest FEASIBLE pose for an unreachable target;
    # servo has no such guarantee and lets the target run away from a blocked
    # arm. That difference is why these three are per-solver.
    per_solver:
      servo:
        translation_scale: 0.5
        max_target_lead: 0.05
        # Must EXCEED max_target_lead, or ordinary tracking lag is mistaken for
        # a teleport and the retargeter re-anchors continuously. The retargeter
        # raises ValueError if this is violated.
        external_motion_threshold: 0.15
      ik:
        # Above 1:1: overshooting the workspace parks the tool at the boundary
        # rather than running away, so amplifying is safe here.
        translation_scale: 1.5
        # A tight leash on this path only throttles responsiveness.
        max_target_lead: 0.30
        external_motion_threshold: 0.50

  ik:
    # Solves per second. Measured on the Dragonwing IQ9075: median solve 2.77
    # ms, p99 4.3 ms, against an 11.1 ms budget -- comfortable. On the desktop
    # the same solve is 0.7 ms.
    solve_rate: 90.0

    # Cost weights for the NLP. Position dominates; orientation is secondary;
    # regularization biases toward nominal_state; smoothness penalises
    # departure from the previous solution.
    weight_position: 50.0

    # Measured on this arm over a 20 s hardware episode:
    #
    #   w=10.0  joint4 0.70 deg/cm, joint6 0.70 deg/cm of tool travel
    #   w= 0.5  joint4 0.42 deg/cm, joint6 0.35 deg/cm  <- half the wrist churn
    #
    # 0.5 is the value that made the arm feel right. The cost is that joint5 is
    # then free to wander toward zero, where the joint4 and joint6 axes align
    # and counter-rotate to no effect: it spent 10.7% of that episode within
    # 5 deg of zero and crossed it, against 4.4% at w=10. Raise this back
    # toward 2-10 if you need tight tool orientation; the real fix for the
    # wrist is a per-joint regularisation weight, which does not exist yet.
    weight_orientation: 0.5

    # The SOLE source of steady-state tracking error. On a 6-DOF arm a pose
    # target fully determines the configuration up to discrete branches, so
    # there is no nullspace for a posture term to shape and it can only pull
    # the solution away from the target. Measured, converged:
    #
    #   0.000 -> 0.011 mm    0.005 -> 0.584 mm
    #   0.020 -> 2.272 mm    0.100 -> 10.09 mm
    #
    # On a 7-DOF arm the same term is nearly free and 0.02 is appropriate.
    weight_regularization: 0.005
    weight_smoothness: 0.1

    # Fraction of each joint's MoveIt maximum velocity teleop may use.
    #
    # 0.5 of 5.0 rad/s is 2.5 rad/s. Replaying a real 20 s episode through the
    # solver offline, 0.50 and 1.00 produce IDENTICAL output -- the solver
    # never demanded more than 2.97 rad/s, 59% of the model limit -- so 0.5 is
    # already "unlimited" for hand-driven motion while keeping a real ceiling.
    # At 0.35 the limiter clipped 5.5% of frames; at 0.5, 0.1%.
    #
    # Do NOT raise this to 1.0. It buys 0.5 mm of p95 tracking error against a
    # 29 mm arm-side residual, and it removes the only thing that spreads an
    # accepted large step over time.
    rate_limit_scale: 0.5

    # Refuse solutions further than this (rad) from the previous SOLUTION: an
    # IK branch flip is valid kinematics but unacceptable motion on hardware.
    # Compared against the previous solution, not the measured state, because
    # the arm legitimately lags and comparing against it refuses everything.
    max_joint_jump: 0.35

    # On a refused jump, retry the solve once pulled this many times harder
    # toward the last accepted solution. Refusing alone leaves the target
    # unchanged, so the next solve rediscovers the branch just rejected and the
    # arm sits still -- which is what "sluggish near a surface" was. Measured:
    # 17 refusals -> 0. Costs ~1.4 ms of an 11 ms budget, only on frames that
    # would otherwise have been dropped. 0 restores plain refusal.
    jump_retry_smoothness: 50.0

    # 'stop' runs at full speed to contact and refuses to enter a collision,
    # holding the last valid command. 'none' disables checking entirely.
    # Servo-style proximity deceleration is deliberately not offered: working
    # near a table means working deliberately close to geometry.
    collision_policy: stop

  gripper:
    enabled: true

    # Which SRDF group actuates the gripper. The open/closed joint values are
    # NOT here: they come from the SRDF group states matching *open*/*close*.
    group: gripper

  controllers:
    # Which ros2_control controller receives the arm trajectory. Genuinely not
    # recorded in any MoveIt artifact, so it has to live here.
    arm: arm_controller

  safety:
    # Deadman. If input goes stale for longer than this the mode manager halts
    # and actively pauses the solver -- note that merely ceasing to publish is
    # not a halt, because the IK node keeps driving toward its last pose target.
    input_timeout: 0.1

    # Homing -- the one motion the operator is NOT driving -- is planned
    # through move_group, so its path is collision-checked against the scene
    # and time-parameterised against joint_limits.yaml. If move_group cannot
    # plan one (most often because the arm's start posture is already touching
    # modelled geometry), it falls back to a direct interpolated move, loudly,
    # which is what this stack did before it could plan at all.
    #
    # The fallback needs nothing robot-specific: it publishes the same
    # JointTrajectory to the same controller topic that the solver streams, so
    # any arm that can be teleoperated can be homed this way. Set false only
    # for an arm whose MoveIt stack cannot execute trajectories.
    home_via_moveit: true

    # The vendored agx_arm_control_gate only opens the CAN gate during
    # FollowJointTrajectory action goals, which never fire for streamed output.
    # The mode manager drives this service itself instead, which also makes it
    # a real deadman on the hardware path. Launch the robot bringup with
    # auto_control_gate:=false so the two do not fight.
    #
    # Leave disabled in simulation; REQUIRED on real hardware.
    hardware_gate:
      service: /control_enable
      enabled: false
      # Whether that gate must ALSO be open while move_group executes a
      # planned trajectory (homing, a waypoint return). true for a gate that
      # ENABLES MOTION, which a planned trajectory needs as much as a streamed
      # command does. false for a gate that SELECTS A STREAMING MODE, because a
      # driver offering one typically refuses to run its trajectory action at
      # the same time -- it would reject the very goal move_group just sent.
      open_for_planning: true

  # --- dataset export ----------------------------------------------------
  # Read by `ros2 run moveit_teleop_record convert`, never by the teleop launch
  # (which ignores this section; the exporter validates it and refuses a key it
  # does not know). Every key here is optional.
  #
  # REQUIRED for export, and already above: move_group, gripper.group (when
  # gripper.enabled), files.preview_urdf, files.preview_srdf and
  # files.preview_xacro_args. An export runs offline -- there is no move_group to
  # ask -- so the robot model has to come from files.
  #
  # NOT here, and never needed: which joints are the arm and the gripper, their
  # order, or their units. The exporter derives all three from the SRDF groups
  # and URDF joint types, so they cannot drift from the robot model.
  dataset:
    # LeRobot's info.json robot_type. Omit to use the URDF robot name ('agx_arm').
    robot_type: agx_piper
    # Camera frames in the dataset: WxH or native. GR00T and pi0.5 both resize to
    # 224 internally, so native only costs decode time at training.
    image_size: 640x360
    # h264 plays in any video player. libsvtav1 (AV1) matches GR00T's own demo
    # data and is about 2/3 the size (4.4 MB against 6.4 MB for four episodes),
    # but VLC 3.0 would not play it. Both GR00T and openpi decode either.
    vcodec: h264
    # Recording stream names (recording.yaml) that become state and action.
    state_stream: joint_states
    action_stream: joint_commands
    # teleop: first engage -> last disengage, dropping idle and homing. none: all.
    trim: teleop
    gr00t:
      # Steps predicted per sample, at the camera's fps. 16 at 15 fps is 1.07 s.
      action_horizon: 16
      # relative = delta from the current state; absolute = target. GR00T's
      # SO-100 reference config: relative arm, absolute gripper.
      arm_action: relative
      gripper_action: absolute
