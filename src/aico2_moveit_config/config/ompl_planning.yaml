# OMPL pipeline. RRTConnect for both arms: it is the default for good reason on
# a 7-DoF arm, and the alternatives mostly matter once there are tight
# clearances, which needs a fuller collision matrix than the generated SRDF has.
planning_plugins:
  - ompl_interface/OMPLPlanner
request_adapters:
  - default_planning_request_adapters/ResolveConstraintFrames
  - default_planning_request_adapters/ValidateWorkspaceBounds
  - default_planning_request_adapters/CheckStartStateBounds
  - default_planning_request_adapters/CheckStartStateCollision
response_adapters:
  # TOTG is time-optimal, which means it saturates acceleration: the result is
  # a trapezoidal velocity profile whose acceleration steps discontinuously at
  # the two corners. Jerk is unbounded there, and on hardware the move reads as
  # three distinct segments -- accelerate, cruise, decelerate. Confirmed by
  # measurement: identical at trajectory_send_rate_hz 2.0 and 50.0, so the
  # segmentation is in the trajectory, not in how it is delivered.
  #
  # Ruckig runs after TOTG and re-times the same path under a jerk limit,
  # replacing each corner with a bounded acceleration ramp. Order matters:
  # TOTG supplies the timing, Ruckig smooths it. Requires the jerk limits in
  # joint_limits.yaml -- without them the adapter has nothing to bound.
  - default_planning_response_adapters/AddTimeOptimalParameterization
  - default_planning_response_adapters/AddRuckigTrajectorySmoothing
  - default_planning_response_adapters/ValidateSolution
  - default_planning_response_adapters/DisplayMotionPath

planner_configs:
  RRTConnectkConfigDefault:
    type: geometric::RRTConnect
    range: 0.0

left_arm:
  planner_configs:
    - RRTConnectkConfigDefault
  projection_evaluator: joints(Left_joint1,Left_joint2)
  longest_valid_segment_fraction: 0.005

right_arm:
  planner_configs:
    - RRTConnectkConfigDefault
  projection_evaluator: joints(Right_joint1,Right_joint2)
  longest_valid_segment_fraction: 0.005

both_arms:
  planner_configs:
    - RRTConnectkConfigDefault
  projection_evaluator: joints(Left_joint1,Right_joint1)
  longest_valid_segment_fraction: 0.005

left_arm_waist:
  planner_configs:
    - RRTConnectkConfigDefault
  # The two waist axes: they dominate where the end effector can reach, so
  # they are what the projection should discriminate on.
  projection_evaluator: joints(AGV_Joint1,AGV_Joint2)
  longest_valid_segment_fraction: 0.005
