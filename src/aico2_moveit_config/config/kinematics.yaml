# IK solvers, one entry per planning group in aico2.srdf.
#
# KDL is used because it ships with MoveIt and needs nothing installed. It is
# a numeric Newton solver and does NOT exploit the arms' 7th joint: on a
# redundant arm it can fail to find a solution that a redundancy-aware solver
# would. If IK failures become the limiting factor, install pick_ik and swap
# the commented block in -- same file, no other change.
left_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3

right_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3

# left_arm:
#   kinematics_solver: pick_ik/PickIkPlugin
#   kinematics_solver_timeout: 0.05
#   mode: global
#   position_scale: 1.0
#   rotation_scale: 0.5
#   position_threshold: 0.001
#   orientation_threshold: 0.01
#   cost_threshold: 0.001
#   minimal_displacement_weight: 0.0
#   gd_step_size: 0.0001

# both_arms has deliberately NO entry, and cannot have a KDL one. It is a
# composite of the left_arm and right_arm subgroups, so it has two tip links
# and no single base->tip chain; KDLKinematicsPlugin requires a serial chain
# and fails to initialise on a multi-tip group.
#
# That costs less than it sounds. Joint-space planning works without IK --
# RRTConnect samples the 14-DoF space directly, which is the ~123 s plan
# observed on hardware. What is missing is pose goals and the RViz
# interactive marker, both of which need IK. A dual-arm Cartesian goal needs
# a multi-tip solver such as bio_ik; pick_ik, like KDL, is single-chain.

# base_link -> Left_flange, i.e. the two waist axes plus the seven arm joints.
# A 9-DoF redundant chain, so KDL has more null space to wander in than on the
# 7-DoF groups; the longer timeout and extra attempts are for that.
left_arm_waist:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.1
  kinematics_solver_attempts: 5
