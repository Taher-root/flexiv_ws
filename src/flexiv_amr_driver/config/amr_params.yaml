/**:
  ros__parameters:
    # AMR Network Configuration
    amr_ip: "192.168.1.110"
    
    # Control Parameters
    control_rate: 10.0
    max_linear_speed: 0.5
    max_angular_speed: 1.0
    rotation_threshold: 0.01
    auto_gain_control: true
    
    # Odometry Parameters
    base_frame: "base_link"
    odom_frame: "odom_raw"
    # false: the EKF owns odom -> base_link. This was true, which made
    # odometry_publisher broadcast a SECOND parent for base_link alongside
    # robot_localization's -- a frame cannot have two parents, so the tree
    # breaks and transforms go unpredictable. amr_params_robokit.yaml already
    # had this right; this file was stale.
    publish_tf: false
    
    # Status Monitor Parameters
    status_rate: 2.0