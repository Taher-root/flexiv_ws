right_arm_driver:
  ros__parameters:
    robot_ip: "192.168.1.101"
    robot_sn: "Rizon4R-062077"
    mock_hardware: false
    auto_enable: true
    operational_timeout_sec: 30.0
    publish_rate_hz: 50.0
    default_max_joint_vel: 1.5
    default_max_joint_acc: 3.0
    goal_joint_tolerance: 0.02
    # Joint control mode for trajectories and servo teleop:
    #   position  -> NRT_JOINT_POSITION  (stiff, historical behaviour)
    #   impedance -> NRT_JOINT_IMPEDANCE (same SendJointPosition stream, but
    #                the arm yields to external force)
    # joint_stiffness_ratio scales K_q_nom on the arm axes only; the waist
    # entries are +inf nominal and pass through untouched. Retunable live:
    #   ros2 param set /<ns>/<node> joint_stiffness_ratio 0.3
    joint_control_mode: "position"
    joint_stiffness_ratio: 1.0
    # Nm ceiling on the torque each arm axis applies against the environment in
    # impedance mode, clamped per axis to RobotInfo.tau_max. Leave it at 0 and
    # nothing bounds the impedance law: a blocked arm demands
    # stiffness x deflection until the controller's collision detection faults
    # it. 10 Nm is roughly 25 N at the forearm. Retunable live:
    #   ros2 param set /<ns>/<node> max_contact_torque 10.0
    max_contact_torque: 0.0
    tcp_frame_id: "Right_flange"
    teleop_backend: cartesian
    cartesian_max_linear_vel: 0.3
    cartesian_max_angular_vel: 1.047
    joint_names:
      - Right_joint1
      - Right_joint2
      - Right_joint3
      - Right_joint4
      - Right_joint5
      - Right_joint6
      - Right_joint7
